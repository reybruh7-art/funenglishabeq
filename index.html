<!DOCTYPE html>
<html lang="id">

  <meta charset="UTF-8">

</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 flex flex-col items-center">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-slate-200 p-5 space-y-5 my-auto">
    <!-- Header -->

      <h1 class="text-2xl font-black text-indigo-600">Listening Lab 🎧</h1>
      <p class="text-xs text-slate-500">1.000 Latihan Kalimat & 100 Kuis Rumpang</p>
    </header>

    <!-- Navigasi Tab -->
    <div class="flex bg-slate-100 p-1 rounded-xl text-sm font-semibold">
      <button id="tabListeningBtn" class="flex-1 py-2 rounded-lg bg-white shadow-sm text-indigo-600 transition">Listening (1-10 Kata)</button>
      <button id="tabQuizBtn" class="flex-1 py-2 rounded-lg text-slate-500 transition">Kuis (100 Soal)</button>
    </div>

    <!-- VIEW 1: LISTENING -->
    <div id="listeningSection" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Pilih Level Panjang Kalimat:</label>
        <div id="levelContainer" class="grid grid-cols-5 gap-1.5 text-xs font-semibold"></div>
      </div>

      <div class="bg-slate-50 border rounded-xl p-5 text-center space-y-4">
        <div class="flex justify-between items-center text-xs font-medium text-slate-400">
          <span id="itemIndicator">Item 1 / 100</span>
          <span id="levelIndicatorBadge" class="bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded font-bold">1 Kata</span>
        </div>

        <div>
          <button id="playBtn" class="bg-indigo-600 active:scale-95 hover:bg-indigo-700 text-white font-bold px-6 py-3 rounded-full shadow-md text-base w-full transition">
            🔊 Putar Audio
          </button>
        </div>

        <!-- Tempo -->
        <div class="flex items-center justify-center gap-2 text-xs">
          <span class="text-slate-400 font-medium">Tempo:</span>
          <button class="tempo-btn px-2.5 py-1 rounded border font-semibold border-slate-200" data-speed="0.75">0.75x</button>
          <button class="tempo-btn px-2.5 py-1 rounded border font-semibold bg-indigo-50 border-indigo-500 text-indigo-600" data-speed="1.0">1.0x</button>
          <button class="tempo-btn px-2.5 py-1 rounded border font-semibold border-slate-200" data-speed="1.25">1.25x</button>
        </div>

        <!-- Opsi Tampilkan Kalimat -->
        <div class="pt-2 border-t border-slate-200">
          <button id="toggleSentenceBtn" class="text-xs text-indigo-600 font-bold underline">
            Tampilkan Kalimat Sesungguhnya
          </button>
          <p id="sentenceDisplay" class="hidden mt-3 font-bold text-slate-800 text-lg leading-relaxed transition"></p>
        </div>
      </div>

      <!-- Navigasi Prev/Next -->
      <div class="flex justify-between items-center text-sm font-semibold">
        <button id="prevBtn" class="px-4 py-2 border rounded-xl active:bg-slate-50 disabled:opacity-40">⬅ Prev</button>
        <button id="nextBtn" class="px-4 py-2 bg-slate-800 text-white rounded-xl active:bg-slate-900 disabled:opacity-40">Next ➡</button>
      </div>
    </div>

    <!-- VIEW 2: KUIS -->
    <div id="quizSection" class="hidden space-y-4 text-center">
      <div class="flex justify-between items-center text-xs font-medium text-slate-400">
        <span id="quizIndicator">Soal 1 / 100</span>
        <span id="quizScoreBadge" class="text-emerald-600 font-bold">Skor: 0</span>
      </div>
      
      <button id="playQuizBtn" class="bg-indigo-600 active:scale-95 hover:bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-full shadow-md text-sm w-full transition">
        🔊 Dengarkan Kalimat Utuh
      </button>

      <div class="p-4 bg-slate-50 border rounded-xl">
        <p id="quizDisplaySentence" class="text-lg font-bold text-slate-700 tracking-wide"></p>
      </div>

      <form id="quizForm" class="flex gap-2">
        <input id="quizInput" type="text" autocomplete="off" placeholder="Ketik kata yang hilang..." class="flex-1 border rounded-xl px-3 py-2 text-sm focus:outline-indigo-500">
        <button type="submit" class="bg-emerald-600 text-white font-bold px-4 py-2 rounded-xl text-sm active:bg-emerald-700 transition">Cek</button>
      </form>

      <p id="quizFeedback" class="text-xs font-bold min-h-[1.25rem]"></p>

      <div class="flex justify-between items-center text-sm font-semibold">
        <button id="prevQuizBtn" class="px-4 py-2 border rounded-xl active:bg-slate-50 disabled:opacity-40">⬅ Prev</button>
        <button id="nextQuizBtn" class="px-4 py-2 bg-slate-800 text-white rounded-xl active:bg-slate-900 disabled:opacity-40">Next ➡</button>
      </div>
    </div>
